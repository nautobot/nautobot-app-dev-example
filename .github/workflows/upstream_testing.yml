---
name: "Nautobot Upstream Monitor"

on:  # yamllint disable-line rule:truthy rule:comments
  schedule:
    - cron: "0 4 */2 * *"  # every other day at 4 AM
  workflow_dispatch:

env:
  INVOKE_NAUTOBOT_DEV_EXAMPLE_PYTHON_VER: "3.12"
jobs:
  build:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        nautobot-branch: ["develop", "ltm-2.4", "next"]
    runs-on: "ubuntu-latest"
    env:
      INVOKE_NAUTOBOT_DEV_EXAMPLE_NAUTOBOT_VER: "${{ matrix.nautobot-branch }}"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ matrix.nautobot-branch == 'develop' && 'develop' || matrix.nautobot-branch == 'next' && 'develop' || matrix.nautobot-branch == 'ltm-2.4' && 'ltm-2.4' || env.GITHUB_REF_NAME || 'develop' }}"
      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v6"
        with:
          poetry-install-options: ""  # override default "--only-dev"
          poetry-version: "2.1.3"
          python-version: "${{ env.INVOKE_NAUTOBOT_DEV_EXAMPLE_PYTHON_VER }}"
      - name: "Constrain Nautobot version and regenerate lock file"
        run: "poetry add --lock git+https://github.com/nautobot/nautobot.git#${{ matrix.nautobot-branch }} --python ${{ env.INVOKE_NAUTOBOT_DEV_EXAMPLE_PYTHON_VER }}"
      - name: "Set up Docker Buildx"
        id: "buildx"
        uses: "docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2"  # v3.10.0
      - name: "Build"
        uses: "docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25"  # v5.4.0
        with:
          builder: "${{ steps.buildx.outputs.name }}"
          context: "./"
          push: false
          tags: "nautobot-dev-example/nautobot:${{ matrix.nautobot-branch }}-py${{ env.INVOKE_NAUTOBOT_DEV_EXAMPLE_PYTHON_VER }}"
          file: "./development/Dockerfile"
          cache-from: "type=gha,scope=${{ matrix.nautobot-branch }}"
          cache-to: "type=gha,scope=${{ matrix.nautobot-branch }}"
          build-args: |
            NAUTOBOT_VER=${{ matrix.nautobot-branch }}
            PYTHON_VER=${{ env.INVOKE_NAUTOBOT_DEV_EXAMPLE_PYTHON_VER }}
            CI=true
          outputs: "type=docker,dest=/tmp/nautobot_${{ matrix.nautobot-branch }}.tar"
      - name: "Upload docker image artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "docker_nautobot_${{ matrix.nautobot-branch }}"
          path: "/tmp/nautobot_${{ matrix.nautobot-branch }}.tar"
  unittest:
    name: "Run unit tests"
    needs: "build"
    strategy:
      fail-fast: false
      matrix:
        nautobot-branch: ["develop", "ltm-2.4", "next"]
    runs-on: "ubuntu-latest"
    env:
      INVOKE_NAUTOBOT_DEV_EXAMPLE_NAUTOBOT_VER: "${{ matrix.nautobot-branch }}"
    steps:
      - name: "Download docker image artifact"
        uses: "actions/download-artifact@v4"
        with:
          name: "docker_nautobot_${{ matrix.nautobot-branch }}"
          path: "/tmp"
      - name: "Load docker image"
        run: "docker load -i /tmp/nautobot_${{ matrix.nautobot-branch }}.tar"
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
        with:
          # Testing is going to target the apps latest release (main branch for nautobot develop/next, ltm branch for the ltm release)
          ref: "${{ matrix.nautobot-branch == 'develop' && 'main' || matrix.nautobot-branch == 'next' && 'main' || matrix.nautobot-branch == 'ltm-2.4' && 'ltm-2.4' || env.GITHUB_REF_NAME || 'develop' }}"
      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v6"
        with:
          poetry-install-options: ""  # override default "--only-dev"
          poetry-version: "2.1.3"
          python-version: "${{ env.INVOKE_NAUTOBOT_DEV_EXAMPLE_PYTHON_VER }}"
      - name: "Run Tests"
        run: "poetry run invoke unittest"
  check-migrations:
    name: "Run invoke check-migrations"
    needs: "build"
    strategy:
      fail-fast: false
      matrix:
        nautobot-branch: ["develop", "ltm-2.4", "next"]
    runs-on: "ubuntu-latest"
    env:
      INVOKE_NAUTOBOT_DEV_EXAMPLE_NAUTOBOT_VER: "${{ matrix.nautobot-branch }}"
    steps:
      - name: "Download docker image artifact"
        uses: "actions/download-artifact@v4"
        with:
          name: "docker_nautobot_${{ matrix.nautobot-branch }}"
          path: "/tmp"
      - name: "Load docker image"
        run: "docker load -i /tmp/nautobot_${{ matrix.nautobot-branch }}.tar"
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ matrix.nautobot-branch == 'develop' && 'develop' || matrix.nautobot-branch == 'next' && 'develop' || matrix.nautobot-branch == '2.4' && 'ltm-2.4' || env.GITHUB_REF_NAME || 'develop' }}"
      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v6"
        with:
          poetry-install-options: ""  # override default "--only-dev"
          poetry-version: "2.1.3"
          python-version: "${{ env.INVOKE_NAUTOBOT_DEV_EXAMPLE_PYTHON_VER }}"
      - name: "Checking: migrations"
        run: "poetry run invoke check-migrations"
